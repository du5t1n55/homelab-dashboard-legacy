server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    # Authentik OAuth pages (authorize, token, etc.) — proxied to Authentik server
    location /application/ {
        proxy_pass          http://192.168.1.81:9000;
        proxy_http_version  1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
    }

    # Authentik outpost — general proxy (signin flow, etc.)
    location /outpost.goauthentik.io {
        proxy_pass          http://192.168.1.81:9000;
        proxy_http_version  1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
    }

    # Internal auth_request endpoint — passes original URL so outpost knows what to protect
    location = /outpost.goauthentik.io/auth/nginx {
        internal;
        proxy_pass              http://192.168.1.81:9000/outpost.goauthentik.io/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length      "";
        proxy_set_header        Host                $host;
        proxy_set_header        X-Original-URL      $scheme://$http_host$request_uri;
        proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto   $scheme;
        proxy_set_header        X-Forwarded-Host    $http_host;
        proxy_set_header        X-Forwarded-Uri     $request_uri;
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$scheme://$host$request_uri;
    }

    # API — protected by Authentik
    location /api/ {
        satisfy any;
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        deny all;

        auth_request        /outpost.goauthentik.io/auth/nginx;
        error_page 401    = @goauthentik_proxy_signin;
        auth_request_set    $auth_cookie $upstream_http_set_cookie;
        add_header          Set-Cookie $auth_cookie;
        auth_request_set    $authentik_username $upstream_http_x_authentik_username;
        add_header          X-Authentik-Username $authentik_username;

        proxy_pass          http://127.0.0.1:8099/api/;
        proxy_set_header    Host $host;
        proxy_http_version  1.1;
    }

    # Static — protected by Authentik
    location / {
        satisfy any;
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        deny all;

        auth_request        /outpost.goauthentik.io/auth/nginx;
        error_page 401    = @goauthentik_proxy_signin;
        auth_request_set    $auth_cookie $upstream_http_set_cookie;
        add_header          Set-Cookie $auth_cookie;

        try_files $uri $uri/ /index.html;
    }
}

# Shared Authentik auth snippets reused across all protected server blocks below
map $host $ak_outpost { default "http://192.168.1.81:9000"; }

# ── Grafana ───────────────────────────────────────────────────────────────────
server {
    listen 192.168.1.127:3000;

    location /outpost.goauthentik.io { proxy_pass http://192.168.1.81:9000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /application/ { proxy_pass http://192.168.1.81:9000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /outpost.goauthentik.io/auth/nginx {
        internal;
        proxy_pass              http://192.168.1.81:9000/outpost.goauthentik.io/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length      "";
        proxy_set_header        Host                $host;
        proxy_set_header        X-Original-URL      $scheme://$http_host$request_uri;
        proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto   $scheme;
        proxy_set_header        X-Forwarded-Host    $http_host;
        proxy_set_header        X-Forwarded-Uri     $request_uri;
    }
    location @goauthentik_proxy_signin { internal; add_header Set-Cookie $auth_cookie; return 302 /outpost.goauthentik.io/start?rd=$scheme://$host:3000$request_uri; }

    location / {
        auth_request        /outpost.goauthentik.io/auth/nginx;
        error_page 401    = @goauthentik_proxy_signin;
        auth_request_set    $auth_cookie $upstream_http_set_cookie;
        auth_request_set    $ak_user     $upstream_http_x_authentik_username;
        add_header          Set-Cookie $auth_cookie;
        proxy_pass          http://127.0.0.1:3000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-WEBAUTH-USER    $ak_user;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
    }
}

